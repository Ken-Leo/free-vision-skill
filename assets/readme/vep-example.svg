<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="180" viewBox="0 0 1200 180"
     role="img" aria-labelledby="vep-title vep-desc">
  <title id="vep-title">VEP/1 协议示例</title>
  <desc id="vep-desc">Visual Evidence Packet 格式的字段结构和示例</desc>

  <defs>
    <linearGradient id="vepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1116;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="180" fill="url(#vepGrad)"/>
  <rect width="1200" height="180" fill="url(#grid)" opacity="0.2"/>

  <!-- Section title -->
  <text x="80" y="40"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="24" font-weight="700" fill="#e6edf3">
    📦 VEP 协议示例
  </text>
  <text x="300" y="40"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" font-weight="400" fill="#8b98a5">
    Visual Evidence Packet v1.0
  </text>

  <!-- VEP code block -->
  <g transform="translate(80 60)">
    <rect x="0" y="0" width="840" height="100" rx="8" fill="#0d1116" stroke="#1b232c" stroke-width="1"/>
    <text x="20" y="30"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" font-weight="600" fill="#8b98a5">
      VEP/1
    </text>
    <text x="70" y="30"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#e6edf3">
      |src=<tspan fill="#7ee787">zhipu/glm-4.6v-flash</tspan>
    </text>
    <text x="70" y="50"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#e6edf3">
      |m=<tspan fill="#38bdf8">error</tspan>
    </text>
    <text x="70" y="70"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#e6edf3">
      |a=<tspan fill="#ffa657">"Cannot find module 'lodash'"</tspan>
    </text>
    <text x="70" y="90"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="14" fill="#e6edf3">
      |t=<tspan fill="#79c0ff">"webpack.config.js:15"</tspan>|e=[module resolution error]|c=<tspan fill="#d2a8ff">0.98</tspan>
    </text>
  </g>

  <!-- Field descriptions -->
  <g transform="translate(960 80)">
    <rect x="0" y="0" width="180" height="100" rx="8" fill="#161b22" stroke="#1b232c" stroke-width="1"/>
    <text x="20" y="25"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" font-weight="600" fill="#8b98a5">
      字段说明
    </text>
    <text x="20" y="45"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#7ee787">
      src — Provider + 模型
    </text>
    <text x="20" y="65"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#38bdf8">
      m — 任务模式
    </text>
    <text x="20" y="85"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#ffa657">
      a — 直接答案
    </text>
  </g>

  <!-- Bottom highlight -->
  <rect x="80" y="175" width="800" height="2" rx="1" fill="#7ee787" opacity="0.3"/>
</svg>
