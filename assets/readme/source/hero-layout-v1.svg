<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Free Vision Skill, 50 to 150 token visual evidence packets</title><desc id="desc">Lora inspects an image and compiles visible evidence into a compact packet for a text model.</desc>
  <defs><pattern id="paper" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r="0.7" fill="#8B5E34" opacity="0.08"/></pattern></defs>
  <rect width="1200" height="380" rx="28" fill="#F7F4EE"/><rect width="1200" height="380" rx="28" fill="url(#paper)"/><path d="M0 8H1200" stroke="#E0A62F" stroke-width="8"/>
  <g transform="translate(58 52)"><text fill="#8B5E34" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="750" letter-spacing="2.1">VISUAL EVIDENCE COMPILER / VEP·1</text><text y="77" fill="#1A1A1A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="56" font-weight="850" letter-spacing="-2">Free Vision Skill</text><text y="124" fill="#4F7A64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="23" font-weight="760">50–150 tokens 的视觉证据包</text><path d="M0 154H462" stroke="#1A1A1A" stroke-width="1.5" opacity="0.16"/><text y="187" fill="#4A4A4A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="17">视觉模型负责看见，文本模型继续负责思考。</text><g transform="translate(0 232)" font-family="ui-monospace, monospace" font-size="13" font-weight="800"><rect width="70" height="34" rx="17" fill="#1A1A1A"/><text x="13" y="22" fill="#F7F4EE">IMAGE</text><text x="82" y="22" fill="#8B5E34">→</text><rect x="104" width="88" height="34" rx="17" fill="#EDE6D6"/><text x="117" y="22" fill="#1A1A1A">EXTRACT</text><text x="204" y="22" fill="#8B5E34">→</text><rect x="226" width="70" height="34" rx="17" fill="#4F7A64"/><text x="239" y="22" fill="#F7F4EE">VEP/1</text><text x="308" y="22" fill="#8B5E34">→</text><rect x="330" width="116" height="34" rx="17" fill="#EDE6D6"/><text x="344" y="22" fill="#1A1A1A">TEXT MODEL</text></g></g>
