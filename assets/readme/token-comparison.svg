<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="280" viewBox="0 0 1200 280"
     role="img" aria-labelledby="token-title token-desc">
  <title id="token-title">Token 节省对比</title>
  <desc id="token-desc">传统方案 vs Free Vision Skill 的 Token 消耗对比</desc>

  <defs>
    <linearGradient id="tokenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1116;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" fill="url(#tokenGrad)"/>

  <!-- Section title -->
  <text x="80" y="40"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="24" font-weight="700" fill="#e6edf3">
    ⚡ Token 节省对比
  </text>

  <!-- Comparison cards -->
  <g transform="translate(80 60)">
    <!-- Traditional approach -->
    <rect x="0" y="0" width="480" height="180" rx="12" fill="#0d1116" stroke="#1b232c" stroke-width="1"/>
    <text x="240" y="35"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" font-weight="600" fill="#8b98a5" text-anchor="middle">
      传统方案
    </text>
    <text x="240" y="70"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="64" font-weight="700" fill="#ff7b72" text-anchor="middle">
      2000-5000
    </text>
    <text x="240" y="100"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#8b98a5" text-anchor="middle">
      tokens/次
    </text>
    <text x="240" y="140"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" fill="#ff7b72" text-anchor="middle">
      ❌ 完整视觉描述
    </text>
    <text x="240" y="160"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#8b98a5" text-anchor="middle">
      上下文污染 · 越权推理
    </text>
  </g>

  <!-- VS badge -->
  <g transform="translate(560 140)">
    <rect x="-40" y="-30" width="80" height="60" rx="40" fill="#7ee787" opacity="0.15" stroke="#7ee787" stroke-width="2"/>
    <text x="0" y="8"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="24" font-weight="700" fill="#7ee787" text-anchor="middle">
      VS
    </text>
  </g>

  <!-- Free Vision Skill -->
  <g transform="translate(640 60)">
    <rect x="0" y="0" width="480" height="180" rx="12" fill="#0d1116" stroke="#7ee787" stroke-width="2"/>
    <text x="240" y="35"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" font-weight="600" fill="#7ee787" text-anchor="middle">
      Free Vision Skill
    </text>
    <text x="240" y="70"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="64" font-weight="700" fill="#7ee787" text-anchor="middle">
      50-150
    </text>
    <text x="240" y="100"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="16" fill="#8b98a5" text-anchor="middle">
      tokens/次
    </text>
    <text x="240" y="140"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" fill="#7ee787" text-anchor="middle">
      ✅ VEP 证据包
    </text>
    <text x="240" y="160"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="12" fill="#8b98a5" text-anchor="middle">
      节省 90-95% · 无上下文污染
    </text>
  </g>

  <!-- Savings highlight -->
  <g transform="translate(80 255)">
    <text x="0" y="0"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="14" font-weight="600" fill="#7ee787">
      ✨ 节省 90-95% tokens · 主模型只接收事实，不接收长描述
    </text>
  </g>
</svg>
